# Backend test configuration. Run with:  npm run test:backend
[pytest]
testpaths = backend/tests
# Backend modules use bare imports (`import constants`, `from db import chat`),
# so backend/ has to be on sys.path for the tests, just like it is when
# main.py runs from that folder.
pythonpath = backend
markers =
    ollama: needs a running Ollama server on localhost:11434 with the configured model (skip with: -m "not ollama")
filterwarnings =
    # python-eel 0.18 uses old pyparsing names; not something these tests can fix
    ignore::DeprecationWarning:eel
